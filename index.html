<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ZainOn</title>
  <style>
    body {
      background-color: #0b0f19;
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: system-ui, -apple-system, sans-serif;
    }

    #native-splash {
      position: fixed;
      inset: 0;
      height: 100vh;
      width: 100vw;
      background-color: #0b0f19;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 999999;
      user-select: none;
      transition: opacity 0.4s ease;
    }

    .splash-logo-box {
      height: 64px;
      width: 64px;
      border-radius: 1rem;
      background: linear-gradient(to top right, #2563eb, #6366f1, #8b5cf6);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 25px 50px -12px rgba(37, 99, 235, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .splash-progress-bar {
      width: 192px;
      height: 6px;
      background-color: #0f172a;
      border-radius: 9999px;
      overflow: hidden;
      margin-top: 32px;
      border: 1px solid #1e293b;
    }

    .splash-progress-fill {
      height: 100%;
      background: linear-gradient(to right, #2563eb, #6366f1, #8b5cf6);
      border-radius: 9999px;
      animation: indeterminate 1.5s infinite linear;
    }

    @keyframes indeterminate {
      0% {
        transform: translateX(-100%);
        width: 50%;
      }

      50% {
        transform: translateX(50%);
        width: 80%;
      }

      100% {
        transform: translateX(200%);
        width: 50%;
      }
    }
  </style>
</head>

<body class="bg-[#0b0f19] text-white overflow-hidden m-0">
  <div id="native-splash">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 16px;">
      <div class="splash-logo-box">
        <svg style="width: 32px; height: 32px; color: white;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"
            d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" />
        </svg>
      </div>
      <div style="display: flex; flex-direction: column; align-items: center;">
        <span style="font-size: 24px; font-weight: 900; letter-spacing: -0.025em; color: white;">ZainOn</span>
        <span
          style="font-size: 11px; font-weight: 600; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.1em; margin-top: 4px;">Realtime
          Workspace</span>
      </div>
    </div>
    <div class="splash-progress-bar">
      <div class="splash-progress-fill"></div>
    </div>
    <span style="font-size: 12px; font-weight: 500; color: #94a3b8; margin-top: 16px;">Restoring ZainOn
      session...</span>
  </div>

  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
